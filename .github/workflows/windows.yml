name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["windows/**", "userscripts/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyside6 pyinstaller

      - name: Draw the icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python make_icon.py

      - name: Build Clipload.exe
        run: pyinstaller --noconfirm --clean --windowed --name Clipload --icon clipload.ico clipload.py

      - name: Add yt-dlp and ffmpeg
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist\Clipload\yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) dist\Clipload\
          Copy-Item ..\userscripts\stream-grabber.user.js dist\Clipload\

      - name: Smoke test
        run: |
          dist\Clipload\yt-dlp.exe --version
          dist\Clipload\ffmpeg.exe -version | Select-Object -First 1
          $p = Start-Process dist\Clipload\Clipload.exe -ArgumentList "--background" -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw "Clipload.exe exited with code $($p.ExitCode)" }
          Stop-Process $p -Force
          "Clipload.exe started fine"

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "2.0" }
          & $iscc "/DAppVersion=$version" clipload.iss
          Compress-Archive dist\Clipload\* ..\dist\Clipload-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clipload-Windows
          path: |
            dist/Clipload-Setup.exe
            dist/Clipload-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Clipload ${{ github.ref_name }} for Windows
          files: |
            dist/Clipload-Setup.exe
            dist/Clipload-portable.zip
